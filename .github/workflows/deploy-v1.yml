name: Deploy V1 to GitHub Pages

# V1 target: https://sebastianvidalnbc.github.io/iceberg-tabs-prototype/
# Deploys to THIS repository's built-in Pages environment. Path-filtered so a
# V2-only change never triggers a V1 deploy. Shared src/ui changes trigger both
# V1 and V2 workflows (each publishes only to its own site).
on:
  push:
    branches: [main]
    paths:
      - "src/v1/**"
      - "src/ui/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# V1 and V2 use distinct concurrency groups so they never cancel each other.
concurrency:
  group: pages-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build V1
        run: npm run build:v1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
